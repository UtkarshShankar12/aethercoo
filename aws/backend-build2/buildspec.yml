version: 0.2
phases:
  pre_build:
    commands:
      - echo Logging in to ECR Private and ECR Public
      - aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin 724413959665.dkr.ecr.us-east-1.amazonaws.com
      - aws ecr-public get-login-password --region us-east-1 | docker login --username AWS --password-stdin public.ecr.aws
  build:
    commands:
      - echo === Build context contents ===
      - find . -not -path './.git/*' | head -50
      - ls -la app/ || echo "NO APP FOLDER"
      - echo === Building Docker image no-cache ===
      - docker build --no-cache --build-arg BASE_IMAGE=public.ecr.aws/docker/library/python:3.11-slim -t aethercoo .
      - docker tag aethercoo:latest 724413959665.dkr.ecr.us-east-1.amazonaws.com/aethercoo:latest
  post_build:
    commands:
      - echo Pushing image to ECR
      - docker push 724413959665.dkr.ecr.us-east-1.amazonaws.com/aethercoo:latest
      - echo IMAGE_PUSHED_SUCCESSFULLY
